[package]
# `voxl` on crates.io belongs to an unrelated crate; the binary is still `voxl`.
name = "voxl-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Low-latency desktop streaming for the browser: an X11 display or a Mac's screen as H.264 over a WebSocket"
repository = "https://github.com/tembo/voxl"
readme = "README.md"
keywords = ["remote-desktop", "streaming", "x11", "h264", "websocket"]
categories = ["command-line-utilities", "multimedia::video"]
# What `cargo publish` uploads: the sources build.rs and the server need, nothing from bench/.
include = [
	"/Cargo.toml",
	"/Cargo.lock",
	"/build.rs",
	"/src",
	"/web",
	"/README.md",
	"/LICENSE",
]

[[bin]]
name = "voxl"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = [
	"rt-multi-thread",
	"macros",
	"net",
	"sync",
	"time",
	"signal",
	"fs",
	"io-util",
] }
axum = { version = "0.8", features = ["ws"] }
libc = "0.2"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
futures-util = { version = "0.3", default-features = false, features = [
	"sink",
] }
nix = { version = "0.31", features = ["fs", "poll", "time"] }
png = "0.18"
zip = { version = "7", default-features = false, features = [
	"deflate-flate2-zlib-rs",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = [
	"shm",
	"damage",
	"xfixes",
	"xtest",
	"shape",
	"xinput",
	"randr",
	"allow-unsafe-code",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[build-dependencies]
bindgen = "0.71"
pkg-config = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 1
