name: Release

# Publishes to crates.io when a version tag (v0.2.0, ...) is pushed, then creates the
# GitHub release: GitHub's generated notes (the pull requests merged since the previous
# tag), with the published crate and Windows executable attached.
# Bump `version` in Cargo.toml on main first; the tag has to match it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi
      # Same toolchain and native libraries as CI: `cargo publish` builds the packaged
      # crate before uploading it.
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.05
      - name: Publish
        run: nix-shell --arg withRust true --run 'cargo publish --locked'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # The exact package that went to crates.io, for the GitHub release.
      - uses: actions/upload-artifact@v4
        with:
          name: crate
          path: target/package/voxl-server-*.crate
          if-no-files-found: error

  windows-build:
    name: Build Windows x86_64 binary
    runs-on: windows-latest
    env:
      VCPKGRS_TRIPLET: x64-windows-static-md
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.0'
      - name: Install native libraries and esbuild
        shell: pwsh
        run: |
          vcpkg install x264 libyuv opus --triplet $env:VCPKGRS_TRIPLET
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          npm install -g esbuild
      - name: Build Windows server
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: voxl-windows-x86_64
          path: target/release/voxl.exe
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [publish, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # History and tags, to find the previous release's tag.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: crate
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: voxl-windows-x86_64
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--verify-tag --title "voxl ${GITHUB_REF_NAME#v}" --generate-notes)
          # The notes list what was merged since the previous version tag.
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            args+=(--notes-start-tag "$prev")
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" dist/*.crate dist/*.exe
