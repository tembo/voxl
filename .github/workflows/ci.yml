name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (oxfmt, oxlint, tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run fmt:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck

  rust:
    name: Rust (rustfmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The native libraries (x264, libyuv, Opus, PulseAudio, xcb), esbuild for
      # build.rs and the Rust toolchain all come from shell.nix.
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.05
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Format
        run: nix-shell --arg withRust true --run 'cargo fmt --check'
      - name: Clippy
        run: nix-shell --arg withRust true --run 'cargo clippy --all-targets --locked -- -D warnings'

  macos:
    name: macOS (rustfmt, clippy)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.0'
          components: clippy, rustfmt
      # x264 and Opus for linking, esbuild for build.rs (libyuv and PulseAudio are Linux-only).
      - run: brew install x264 opus pkgconf esbuild
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  windows:
    name: Windows (rustfmt, clippy, smoke test)
    runs-on: windows-latest
    env:
      # Static x264, libyuv and Opus (with the DLL C runtime, as Rust uses), so
      # voxl.exe runs on its own.
      VCPKGRS_TRIPLET: x64-windows-static-md
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.0'
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-x264-libyuv-opus-v1
      - name: Native libraries (vcpkg) and esbuild
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          vcpkg install x264 libyuv opus --triplet $env:VCPKGRS_TRIPLET
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          npm install -g esbuild
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      # The runner has a desktop session: stream it, type into Notepad through voxl
      # and check what comes back.
      - name: Smoke test
        shell: pwsh
        run: |
          pip install websockets
          Start-Process notepad -WindowStyle Maximized
          Start-Sleep 2
          $voxl = Start-Process target\release\voxl.exe -ArgumentList '--port=6901' -PassThru -NoNewWindow -RedirectStandardError voxl.log
          Start-Sleep 5
          $env:SMOKE_SHOT = 'smoke.png'
          python bench/smoke.py 127.0.0.1:6901 windows
          $ok = $LASTEXITCODE -eq 0
          $clip = Get-Clipboard
          Write-Output "clipboard: $clip"
          if ($clip -ne 'voxl-clipboard-check') { Write-Output 'FAIL clipboard from the viewer'; $ok = $false }
          Stop-Process $voxl
          Get-Content voxl.log
          if (-not $ok) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke
          path: |
            smoke.png
            voxl.log
