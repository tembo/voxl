name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (oxfmt, oxlint, tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run fmt:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck

  rust:
    name: Rust (rustfmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The native libraries (x264, libyuv, Opus, PulseAudio, xcb), esbuild for
      # build.rs and the Rust toolchain all come from shell.nix.
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.05
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Format
        run: nix-shell --arg withRust true --run 'cargo fmt --check'
      - name: Clippy
        run: nix-shell --arg withRust true --run 'cargo clippy --all-targets --locked -- -D warnings'

  macos:
    name: macOS (rustfmt, clippy)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.0'
          components: clippy, rustfmt
      # x264 and Opus for linking, esbuild for build.rs (libyuv and PulseAudio are Linux-only).
      - run: brew install x264 opus pkgconf esbuild
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
