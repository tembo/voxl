backend = "xrender";
use-damage = false;
xrender-sync-fence = true;
unredir-if-possible = false;
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'tint2'"
];
shadow = false;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'tint2'"
];
fading = false;
