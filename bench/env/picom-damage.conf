# The Computer preview's picom config today: damage tracking on. Needs the monorepo's
# back-buffer patch for picom (nix/sandbox/guest/computer-preview/patches), or windows get holes.
backend = "xrender";
use-damage = true;
xrender-sync-fence = true;
unredir-if-possible = false;
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'tint2'"
];
shadow = false;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'tint2'"
];
fading = false;
